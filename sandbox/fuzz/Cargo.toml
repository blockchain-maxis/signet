[package]
name = "signet-simulator-fuzz"
description = "Fuzz targets for signet-simulator (stub; excluded from default-members)."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
serde_json = "1"
base64 = "0.22"
stellar-xdr = { version = "22", default-features = false, features = ["std", "serde_json"] }

[[bin]]
name = "framing"
path = "fuzz_targets/framing.rs"
test = false
doc = false
bench = false

[[bin]]
name = "dispatch"
path = "fuzz_targets/dispatch.rs"
test = false
doc = false
bench = false

[[bin]]
name = "xdr_params"
path = "fuzz_targets/xdr_params.rs"
test = false
doc = false
bench = false

[workspace]
members = ["."]
