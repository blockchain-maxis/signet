[workspace]
resolver = "2"
members = [
    "crates/counter_v1",
    "crates/counter_v2_return",
    "crates/counter_v2_event",
    "crates/counter_v2_auth",
    "crates/counter_v2_cost",
    "crates/counter_v2_write",
    "crates/profile_v1",
    "crates/profile_v2_field",
    "crates/profile_v2_optional",
    "crates/caller",
    "crates/callee",
    "crates/looper",
    "crates/hog",
    "crates/vesting",
    "crates/dice",
    "crates/relay",
]

[workspace.dependencies]
# Pinned: 28.0.0 is the release whose #[contracttype] structs read through
# CAP-86's sparse unpack (they import sparse_map_unpack_to_linear_memory),
# which the layout check (#571) and spec_diff's struct-field rule (#570)
# are tested against.
soroban-sdk = "=28.0.0"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
