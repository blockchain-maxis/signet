[package]
name = "signet-simulator"
description = "Signet contract simulator: a separate executable the signet CLI drives over stdio."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
build = "build.rs"

[[bin]]
name = "signet-simulator"
path = "src/main.rs"

[features]
# Each lane can be left out for a faster local build (`--no-default-features
# --features lane-p29`); a release carries both.
default = ["lane-p28", "lane-p29"]
lane-p28 = ["dep:soroban-env-host-p28", "dep:soroban-simulation-p28", "dep:soroban-ledger-snapshot-p28"]
lane-p29 = ["dep:soroban-env-host-p29", "dep:soroban-simulation-p29"]

[dependencies]
soroban-env-host-p28 = { workspace = true, optional = true }
soroban-simulation-p28 = { workspace = true, optional = true }
soroban-ledger-snapshot-p28 = { workspace = true, optional = true }
soroban-env-host-p29 = { workspace = true, optional = true }
soroban-simulation-p29 = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
base64.workspace = true
anyhow.workspace = true
sha2.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
