name: Release CLI

# Builds the signet CLI (Go, cross-compiled) and the signet-simulator (Rust,
# built natively per target), publishes per-platform archives holding BOTH
# binaries plus `checksums.txt` to a GitHub Release, and publishes the npm
# wrapper (@signet/cli) plus one platform-specific optionalDependency package
# per target, each also holding both binaries — the pattern esbuild, swc, and
# turbo use, since `npx` executes JavaScript and cannot run a Go binary
# directly.
#
# docs/CLI_RUST_BRIDGE.md section 5 wants both binaries of a release built from
# the same tag in "one release job". A Rust binary embedding `wasmi` does not
# cross-compile to macOS from Linux without an Apple SDK, so the simulator is
# built by a matrix of native jobs (build-simulator.yml, reusable). The
# invariant is kept by construction: every matrix job and the assembling
# `release` job run in THIS one workflow run, check out the same tag, and the
# `release` job (`needs: simulator`) is the only place the two binaries meet.
# Never split the matrix into a separate workflow or a separate tag.
#
# Go cross-compiles cleanly from one runner (just GOOS/GOARCH env vars, no
# cgo — see cli/go.mod's no-cgo requirement). The assembly (Go build, staging,
# archives, checksums, shim pin) is scripts/release/build-cli.sh, also run by
# the PR dry run (release-cli-dry-run.yml), which calls the same
# build-simulator.yml, so the two cannot drift.
#
# Before anything is published, scripts/release/verify-artifacts.sh checks that
# every platform package and every archive holds both binaries and that
# checksums.txt verifies. The dry run calls the same script, so the invariant is
# enforced identically in review and in a real release.
#
# glibc floor: the Linux simulators are *-unknown-linux-gnu built on Ubuntu
# 24.04 runners, so they need glibc >= 2.39. The Go binary is static; only the
# simulator has this floor.
#
# OPT-IN, like deploy.yml: the actual publish steps are gated on
# `vars.CLI_RELEASE_ENABLED == 'true'`, so they no-op for forks and until:
#   - repository variable  CLI_RELEASE_ENABLED = "true"
#   - environment secret    NPM_TOKEN             (npm automation token,
#                                                   publish access to @signet)
# are both configured. The build/checksum steps always run — harmless, and
# useful for verifying the matrix builds even before publishing is wired up.
#
# Triggered by pushing a `cli-v*.*.*` tag (e.g. `cli-v0.1.0`), or manually via
# workflow_dispatch against an existing tag.

on:
  push:
    tags:
      - 'cli-v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to release (e.g. cli-v0.1.0)'
        required: true

concurrency:
  group: release-cli-${{ github.event.inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  simulator:
    name: build simulator
    uses: ./.github/workflows/build-simulator.yml
    with:
      ref: ${{ github.event.inputs.tag || github.ref }}
    permissions:
      contents: read

  release:
    name: build, checksum, and publish
    needs: simulator
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-go@v7
        with:
          go-version-file: cli/go.mod

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      # One artifact per target, simulator-<npm_pkg>/signet-simulator[.exe].
      - uses: actions/download-artifact@v8
        with:
          pattern: simulator-*
          path: simulator-artifacts

      - name: Resolve version
        id: version
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#cli-v}" >> "$GITHUB_OUTPUT"

      # The cross-compile loop, per-package staging (both binaries), archives,
      # checksums and shim pin live in scripts/release/build-cli.sh, shared with
      # the PR dry run (release-cli-dry-run.yml) so the two cannot drift.
      - name: Build every target, stage npm packages, archive, checksum, pin shim
        env:
          VERSION: ${{ steps.version.outputs.version }}
          COMMIT: ${{ github.sha }}
          SIMULATOR_DIR: simulator-artifacts
        run: scripts/release/build-cli.sh

      # Refuse to publish a release whose archives or platform packages are
      # missing either binary, or whose checksums.txt does not verify.
      - name: Verify both binaries in every artifact
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: scripts/release/verify-artifacts.sh

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: signet CLI ${{ steps.version.outputs.version }}
          files: |
            cli/dist/*.tar.gz
            cli/dist/*.zip
            cli/dist/checksums.txt
          generate_release_notes: true

      - name: Publish npm packages
        if: ${{ vars.CLI_RELEASE_ENABLED == 'true' }}
        working-directory: cli
        run: |
          set -euo pipefail
          shopt -s nullglob
          # Every staged platform package, then the shim. Deriving the list from
          # the staged directories keeps a newly added target from being
          # forgotten here.
          for dir in npm/cli-*/ npm/cli; do
            [[ -f "${dir}package.json" ]] || continue
            npm publish "$dir" --provenance --access public
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
