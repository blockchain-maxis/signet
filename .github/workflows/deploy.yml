name: Deploy

# Continuous delivery for the parts of Signet that CI can't cover on its own:
#   1. apply pending Prisma migrations to the production database
#   2. build & publish the indexer worker image (GHCR)
#
# The web app deploys via Netlify's git integration (see netlify.toml), so it is
# intentionally not duplicated here.
#
# This workflow is OPT-IN: every job is gated on `vars.DEPLOY_ENABLED == 'true'`
# so it no-ops for forks and until you wire up the required secrets/vars:
#   - repository variable  DEPLOY_ENABLED = "true"
#   - environment secret   DATABASE_URL   (production Postgres connection string)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  migrate:
    name: prisma migrate deploy
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6.0.10

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply migrations
        run: pnpm db:deploy
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

  indexer-image:
    name: build & push indexer image
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    needs: migrate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build & push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/indexer/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}-indexer:latest
            ghcr.io/${{ github.repository }}-indexer:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
