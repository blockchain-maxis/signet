name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  docs:
    name: docs links · env · scripts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # Fails on broken relative links/anchors, env vars out of lockstep with
      # .env.example, and pnpm/cargo script names cited in markdown that do not
      # exist. No install step — pure Node stdlib, well under 60s.
      - name: Check docs drift
        run: node scripts/check-docs.mjs

      # Fails when the contract's Error enum (packages/contracts/identity-registry/src/lib.rs)
      # and its hand-mirrored TypeScript messages (apps/web/lib/contract-errors.ts)
      # drift apart. Pure regex parsing — no Rust toolchain needed.
      - name: Check contract error sync
        run: node scripts/check-contract-errors.mjs

      # Fails when the generated Go mirror of WALLET_SOURCES
      # (packages/types/generated/wallet_source.go) drifts from its TypeScript
      # source of truth (packages/types/src/wallet-source.ts). No Go toolchain
      # needed — it just regenerates in memory and diffs.
      - name: Check wallet source Go sync
        run: node scripts/check-wallet-source-go.mjs

  web:
    name: lint • typecheck • test • build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6.0.9

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      # Advisory for now (does not fail the build) — the repo has pre-existing
      # formatting drift from before this check existed. Flip to blocking once
      # a follow-up reformat lands.
      - name: Format check
        run: pnpm format:check || true

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  contracts:
    name: soroban contract tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            packages/contracts/target
          key: cargo-${{ hashFiles('packages/contracts/Cargo.lock') }}

      - name: Test
        working-directory: packages/contracts
        run: cargo test

      - name: Build wasm
        working-directory: packages/contracts
        run: cargo build --target wasm32v1-none --release

      # Guardrail against accidental contract bloat — a heavy dependency, a
      # broken release profile (opt-level/lto/strip), or unbounded logic can
      # balloon the deployment artifact. identity-registry is ~9 KB today; the
      # 20 KB budget leaves headroom for planned growth while still catching a
      # regression. Bump BUDGET_BYTES deliberately when a size increase is
      # expected and justified.
      - name: Wasm size budget
        working-directory: packages/contracts
        env:
          BUDGET_BYTES: 20480
        run: |
          wasm="target/wasm32v1-none/release/identity_registry.wasm"
          if [ ! -f "$wasm" ]; then
            echo "::error::Expected wasm not found at $wasm"
            exit 1
          fi
          size=$(wc -c < "$wasm")
          echo "identity_registry.wasm: ${size} bytes (budget ${BUDGET_BYTES} bytes)"
          if [ "$size" -gt "$BUDGET_BYTES" ]; then
            echo "::error::Contract wasm ${size} bytes exceeds budget ${BUDGET_BYTES} bytes"
            exit 1
          fi

  e2e:
    name: e2e smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6.0.9

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ hashFiles('apps/web/package.json') }}

      - name: Install Playwright browsers
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @signet/web exec playwright install --with-deps chromium

      - name: Install Playwright browser deps (cached hit)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: pnpm --filter @signet/web exec playwright install-deps chromium

      - name: Build web app
        run: pnpm --filter @signet/web build

      - name: Run e2e smoke tests
        run: pnpm --filter @signet/web test:e2e

  security:
    name: dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6.0.9

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Advisory for now (does not fail the build) — flip to blocking once the
      # tree is clean. Tighten the level to `moderate` as you triage.
      - name: pnpm audit
        run: pnpm audit --audit-level high || true

      - uses: dtolnay/rust-toolchain@stable

      - name: cargo audit
        run: |
          cargo install cargo-audit --locked || true
          (cd packages/contracts && cargo audit) || true
