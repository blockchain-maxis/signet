name: CI

on:
  push:
    branches: [main]
  pull_request:

# One in-flight run per branch. Superseding only cancels on pull_request:
# a run on `main` is the record of whether that merged commit is green, and
# two merges landing close together would otherwise cancel the first commit's
# run before it ever reported.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  docs:
    name: docs links · env · scripts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # Fails on broken relative links/anchors, env vars out of lockstep with
      # .env.example, and pnpm/cargo script names cited in markdown that do not
      # exist. No install step — pure Node stdlib, well under 60s.
      - name: Check docs drift
        run: node scripts/check-docs.mjs

      # Fails when the contract's Error enum (packages/contracts/identity-registry/src/lib.rs)
      # and its hand-mirrored TypeScript messages (apps/web/lib/contract-errors.ts)
      # drift apart. Pure regex parsing — no Rust toolchain needed.
      - name: Check contract error sync
        run: node scripts/check-contract-errors.mjs

      # Fails when the generated Go mirror of WALLET_SOURCES
      # (packages/types/generated/wallet_source.go) drifts from its TypeScript
      # source of truth (packages/types/src/wallet-source.ts). No Go toolchain
      # needed — it just regenerates in memory and diffs.
      - name: Check wallet source Go sync
        run: node scripts/check-wallet-source-go.mjs

  web:
    name: lint • typecheck • test • build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6.0.9

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      # Advisory for now (does not fail the build) — the repo has pre-existing
      # formatting drift from before this check existed. Flip to blocking once
      # a follow-up reformat lands.
      - name: Format check
        run: pnpm format:check || true

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  cli:
    name: signet CLI (Go)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v5
        with:
          go-version-file: cli/go.mod

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      # -race needs cgo (a C toolchain), which ubuntu-latest ships with —
      # unlike the CGO_ENABLED=0 production build (see cmd/signet's
      # cross-compile requirement), the test binary is never distributed.
      - name: Test
        run: go test -race ./...

      # Three things have to agree here, and the original v6 + `version: latest`
      # got two of them wrong:
      #   * cli/.golangci.yml is a v2 config (`version: "2"`, and the v2-only
      #     `formatters:` block), so the action must be v8 — v6 drives
      #     golangci-lint v1 and passes v1-only flags.
      #   * golangci-lint refuses to run when the Go version it was *built with*
      #     is older than the module's target, so this release has to be one
      #     built with >= go 1.25 to match cli/go.mod. v2.1.6 is built with
      #     go1.24 and fails with "can't load config: the Go language version
      #     (go1.24) ... is lower than the targeted Go version (1.25.0)".
      #   * `latest` would let both of those drift again without a commit here.
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.13.2
          working-directory: cli

      # Cross-compile smoke build — the CLI is consumed as a prebuilt binary
      # from a release, not from this repo, so a build break for a platform
      # nobody's local machine matches (e.g. linux/arm64 built from an amd64
      # dev box) would otherwise stay invisible until it broke on a
      # stranger's machine. No cgo (see go.mod), so each target only needs
      # GOOS/GOARCH — no per-platform runner or toolchain. The four targets
      # are the same set release-cli.yml publishes.
      - name: Cross-compile smoke build
        run: |
          set -euo pipefail
          targets=(
            "linux   amd64"
            "linux   arm64"
            "darwin  arm64"
            "windows amd64"
          )
          for target in "${targets[@]}"; do
            read -r goos goarch <<< "$target"
            echo "::group::build ${goos}/${goarch}"
            CGO_ENABLED=0 GOOS="$goos" GOARCH="$goarch" go build -o /dev/null ./cmd/signet
            echo "::endgroup::"
          done

  contracts:
    name: soroban contract tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            packages/contracts/target
          key: cargo-${{ hashFiles('packages/contracts/Cargo.lock') }}

      - name: Test
        working-directory: packages/contracts
        run: cargo test

      - name: Build wasm
        working-directory: packages/contracts
        run: cargo build --target wasm32v1-none --release

      # Guardrail against accidental contract bloat — a heavy dependency, a
      # broken release profile (opt-level/lto/strip), or unbounded logic can
      # balloon the deployment artifact. identity-registry is ~9 KB today; the
      # 20 KB budget leaves headroom for planned growth while still catching a
      # regression. Bump BUDGET_BYTES deliberately when a size increase is
      # expected and justified.
      - name: Wasm size budget
        working-directory: packages/contracts
        env:
          BUDGET_BYTES: 20480
        run: |
          wasm="target/wasm32v1-none/release/identity_registry.wasm"
          if [ ! -f "$wasm" ]; then
            echo "::error::Expected wasm not found at $wasm"
            exit 1
          fi
          size=$(wc -c < "$wasm")
          echo "identity_registry.wasm: ${size} bytes (budget ${BUDGET_BYTES} bytes)"
          if [ "$size" -gt "$BUDGET_BYTES" ]; then
            echo "::error::Contract wasm ${size} bytes exceeds budget ${BUDGET_BYTES} bytes"
            exit 1
          fi

  e2e:
    name: e2e smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6.0.9

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ hashFiles('apps/web/package.json') }}

      - name: Install Playwright browsers
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @signet/web exec playwright install --with-deps chromium

      - name: Install Playwright browser deps (cached hit)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: pnpm --filter @signet/web exec playwright install-deps chromium

      - name: Build web app
        run: pnpm --filter @signet/web build

      - name: Run e2e smoke tests
        run: pnpm --filter @signet/web test:e2e

  security:
    name: dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6.0.9

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Advisory for now (does not fail the build) — flip to blocking once the
      # tree is clean. Tighten the level to `moderate` as you triage.
      - name: pnpm audit
        run: pnpm audit --audit-level high || true

      - uses: dtolnay/rust-toolchain@stable

      - name: cargo audit
        run: |
          cargo install cargo-audit --locked || true
          (cd packages/contracts && cargo audit) || true
