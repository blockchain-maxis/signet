name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    name: lint • typecheck • test • build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  contracts:
    name: soroban contract tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            packages/contracts/target
          key: cargo-${{ hashFiles('packages/contracts/Cargo.lock') }}

      - name: Test
        working-directory: packages/contracts
        run: cargo test

      - name: Build wasm
        working-directory: packages/contracts
        run: cargo build --target wasm32v1-none --release

  security:
    name: dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Advisory for now (does not fail the build) — flip to blocking once the
      # tree is clean. Tighten the level to `moderate` as you triage.
      - name: pnpm audit
        run: pnpm audit --audit-level high || true

      - uses: dtolnay/rust-toolchain@stable

      - name: cargo audit
        run: |
          cargo install cargo-audit --locked || true
          (cd packages/contracts && cargo audit) || true
