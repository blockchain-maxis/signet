name: CI

on:
  push:
    branches: [main]
  pull_request:

# One in-flight run per branch. Superseding only cancels on pull_request:
# a run on `main` is the record of whether that merged commit is green, and
# two merges landing close together would otherwise cancel the first commit's
# run before it ever reported.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Path filter for the `sandbox` job only. Every other job in this workflow
  # runs on every PR, as before; do not add `needs: changes` to them without
  # deciding that on purpose. Runs on pushes to main too (diffed against the
  # previous commit), so main keeps a record of the sandbox job.
  changes:
    name: changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      sandbox: ${{ steps.filter.outputs.sandbox }}
    steps:
      - uses: actions/checkout@v7

      # dorny/paths-filter v4.0.3, pinned to the commit.
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d
        id: filter
        with:
          filters: |
            sandbox:
              - 'sandbox/**'
              - 'cli/internal/cmd/sandbox*'
              - 'cli/internal/cmd/dev*'
              - 'cli/internal/cmd/visualise*'
              - 'cli/internal/visualise/**'
              - 'cli/internal/dev/**'
              - 'cli/internal/bundle/**'
              - 'cli/internal/simulator/**'
              - 'cli/internal/fork/**'
              - 'cli/internal/rpc/**'
              - 'cli/internal/realtx/**'
              - 'scripts/check-bench.mjs'
              # The shared spec reader the host is held to (#547).
              - 'packages/spec/**'
              - '.github/workflows/ci.yml'

  docs:
    name: docs links · env · scripts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # Fails on broken relative links/anchors, env vars out of lockstep with
      # .env.example, and pnpm/cargo script names cited in markdown that do not
      # exist. No install step — pure Node stdlib, well under 60s.
      - name: Check docs drift
        run: node scripts/check-docs.mjs

      # Fails when production code imports the recorded testnet fixtures
      # (packages/fixtures is test-only). Pure Node stdlib.
      - name: Check fixtures are not imported by production code
        run: node scripts/check-fixtures-import.mjs

      # Fails when the contract's Error enum (packages/contracts/identity-registry/src/lib.rs)
      # and its hand-mirrored TypeScript messages (apps/web/lib/contract-errors.ts)
      # drift apart. Pure regex parsing — no Rust toolchain needed.
      - name: Check contract error sync
        run: node scripts/check-contract-errors.mjs

      # Fails when the generated Go mirror of WALLET_SOURCES
      # (packages/types/generated/wallet_source.go) drifts from its TypeScript
      # source of truth (packages/types/src/wallet-source.ts). No Go toolchain
      # needed — it just regenerates in memory and diffs.
      - name: Check wallet source Go sync
        run: node scripts/check-wallet-source-go.mjs

      # Same guard for the CLI wire contract: cli/internal/spec/zz_generated_api.go
      # is generated from packages/types/src/cli-api.ts, and the CLI maps exit
      # codes from the failure codes it declares. Also no Go toolchain needed.
      - name: Check CLI spec Go sync
        run: node scripts/check-cli-spec-go.mjs

      # Fails when docs/api/openapi-v1.json is out of sync with the TypeScript
      # schema definitions in apps/web/lib/api/v1/openapi.ts.
      - name: Check OpenAPI snapshot freshness
        run: node --experimental-strip-types apps/web/scripts/export-openapi.mts --check

      # Fails on breaking changes to OpenAPI v1 compared against main snapshot.
      - name: Check OpenAPI breaking changes
        run: node scripts/check-openapi-breaking.mjs

      # Runs fixture unit tests for the breaking change detector.
      - name: Test OpenAPI breaking change detector
        run: node --test scripts/check-openapi-breaking.test.mjs

  web:
    name: lint • typecheck • test • build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6.1.0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      # Advisory for now (does not fail the build) — the repo has pre-existing
      # formatting drift from before this check existed. Flip to blocking once
      # a follow-up reformat lands.
      - name: Format check
        run: pnpm format:check || true

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Smoke check generated TypeScript client stub
        run: pnpm --filter @signet/spec smoke:client

      # Fails when cli/internal/visualise/bundle/visualiser.js, the visualiser
      # the Go CLI embeds, is stale against packages/visualiser or over its
      # 2 MB budget (#544).
      - name: Check the CLI's visualiser bundle
        run: node scripts/check-visualiser-bundle.mjs

      - name: Build
        run: pnpm build

      # The page equivalent of the wasm size budget below: fails when the
      # contract page's first-load JS grows past its declared budget. Reads the
      # build's per-route stats, so it must run after Build.
      - name: Check route JS budgets
        run: node scripts/check-route-budgets.mjs

  # Tests run on every OS the CLI ships for, because several packages behave
  # differently per OS in ways a cross-compile cannot catch: internal/browser
  # (open / xdg-open / rundll32), internal/config (os.UserConfigDir is
  # XDG_CONFIG_HOME, ~/Library/Application Support or %AppData%),
  # internal/loopback (binding 127.0.0.1, the Private Network Access
  # preflight), and the fakestellar test helper (needs .exe on Windows).
  cli:
    name: signet CLI (Go, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        working-directory: cli
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: cli/go.mod

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      # -race needs cgo (a C toolchain). ubuntu-latest and macos-latest always
      # have one; unlike the CGO_ENABLED=0 production build (see cmd/signet's
      # cross-compile requirement), the test binary is never distributed, so
      # cgo in the test build is fine. On Windows, Go only enables cgo when it
      # finds gcc on PATH, which the runner image does not promise, so there
      # the suite runs without -race rather than failing to build. The Windows
      # leg exists to catch per-OS behaviour; the Linux and macOS legs already
      # race-check the same code.
      - name: Test
        run: |
          if [ "$(go env CGO_ENABLED)" = "1" ]; then
            go test -race ./...
          else
            echo "cgo unavailable on $RUNNER_OS; running without -race"
            go test ./...
          fi

      # The downloadable Go client stub (#480) must compile against the real Go
      # SDK: generate it for the registry and types_zoo fixtures and `go vet` it
      # in a throwaway module. Ubuntu only, because the generator is TypeScript
      # and its output does not depend on the OS.
      - uses: pnpm/action-setup@v6.1.0
        if: matrix.os == 'ubuntu-latest'

      - uses: actions/setup-node@v7
        if: matrix.os == 'ubuntu-latest'
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies (Go stub check)
        if: matrix.os == 'ubuntu-latest'
        working-directory: .
        run: pnpm install --frozen-lockfile

      - name: Generate and vet the Go client stub
        if: matrix.os == 'ubuntu-latest'
        working-directory: apps/web
        run: node --experimental-strip-types scripts/vet-go-stub.mts

      # Lint and the cross-compile smoke build run on Ubuntu only. The CLI has
      # no OS-specific source files or build tags, so every OS compiles the
      # same code and a lint pass on one of them sees all of it; the smoke
      # build sets GOOS/GOARCH itself and needs no per-OS runner. Running
      # either on all three legs would triple the cost and cover nothing new.
      # If an OS-specific file is ever added, lint needs to run on that OS too.

      # Three things have to agree here, and the original v6 + `version: latest`
      # got two of them wrong:
      #   * cli/.golangci.yml is a v2 config (`version: "2"`, and the v2-only
      #     `formatters:` block), so the action major has to be one that drives
      #     golangci-lint v2 — v8 and v9 both do; v6 drives v1 and passes
      #     v1-only flags.
      #   * golangci-lint refuses to run when the Go version it was *built with*
      #     is older than the module's target, so this release has to be one
      #     built with >= go 1.25 to match cli/go.mod. v2.1.6 is built with
      #     go1.24 and fails with "can't load config: the Go language version
      #     (go1.24) ... is lower than the targeted Go version (1.25.0)".
      #   * `latest` would let both of those drift again without a commit here.
      - if: runner.os == 'Linux'
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2
          working-directory: cli

      # Cross-compile smoke build — the CLI is consumed as a prebuilt binary
      # from a release, not from this repo, so a build break for a platform
      # nobody's local machine matches (e.g. linux/arm64 built from an amd64
      # dev box) would otherwise stay invisible until it broke on a
      # stranger's machine. No cgo (see go.mod), so each target only needs
      # GOOS/GOARCH — no per-platform runner or toolchain. The targets
      # are the same set release-cli.yml publishes.
      - name: Cross-compile smoke build
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          targets=(
            "linux   amd64"
            "linux   arm64"
            "darwin  arm64"
            "darwin  amd64"
            "windows amd64"
          )
          for target in "${targets[@]}"; do
            read -r goos goarch <<< "$target"
            echo "::group::build ${goos}/${goarch}"
            CGO_ENABLED=0 GOOS="$goos" GOARCH="$goarch" go build -o /dev/null ./cmd/signet
            echo "::endgroup::"
          done

  contracts:
    name: soroban contract tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            packages/contracts/target
          key: cargo-${{ hashFiles('packages/contracts/Cargo.lock') }}

      # soroban-sdk 28 refuses a plain `cargo build` for a contract and
      # requires `stellar contract build` with stellar-cli >= 25.2.0.
      - name: Install stellar-cli
        env:
          STELLAR_CLI_VERSION: 25.2.0
        run: |
          curl -sSfL "https://github.com/stellar/stellar-cli/releases/download/v${STELLAR_CLI_VERSION}/stellar-cli-${STELLAR_CLI_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP" stellar
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Test
        working-directory: packages/contracts
        run: cargo test

      - name: Build wasm
        working-directory: packages/contracts
        run: stellar contract build

      # The simulator's goldens for the registry (#574) pin the source's
      # behaviour: count, resolve, lookup, a taken claim, a release by a
      # non-owner, an oversized batch. They run on the WASM built above; a
      # change to the contract that changes any of them fails here with the
      # first differing line (UPDATE_GOLDEN=1 rewrites them).
      - name: Simulator goldens on the built registry
        working-directory: sandbox
        env:
          SIGNET_REGISTRY_WASM: ${{ github.workspace }}/packages/contracts/target/wasm32v1-none/release/identity_registry.wasm
        run: cargo test --locked -p signet-simulator --test simulate golden

      # Guardrail against accidental contract bloat — a heavy dependency, a
      # broken release profile (opt-level/lto/strip), or unbounded logic can
      # balloon the deployment artifact. identity-registry is ~9 KB today; the
      # 20 KB budget leaves headroom for planned growth while still catching a
      # regression. Bump BUDGET_BYTES deliberately when a size increase is
      # expected and justified.
      - name: Wasm size budget
        working-directory: packages/contracts
        env:
          BUDGET_BYTES: 20480
        run: |
          wasm="target/wasm32v1-none/release/identity_registry.wasm"
          if [ ! -f "$wasm" ]; then
            echo "::error::Expected wasm not found at $wasm"
            exit 1
          fi
          size=$(wc -c < "$wasm")
          echo "identity_registry.wasm: ${size} bytes (budget ${BUDGET_BYTES} bytes)"
          if [ "$size" -gt "$BUDGET_BYTES" ]; then
            echo "::error::Contract wasm ${size} bytes exceeds budget ${BUDGET_BYTES} bytes"
            exit 1
          fi

  spec-fixtures:
    name: spec fixtures parity
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # No toolchain input on purpose: packages/spec/fixture-contracts
      # pins its exact toolchain (rust-toolchain.toml), so CI builds with
      # the same compiler the fixtures were committed from.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            packages/spec/fixture-contracts/target
          key: cargo-fixtures-${{ hashFiles('packages/spec/fixture-contracts/Cargo.lock') }}

      # soroban-sdk 28 refuses a plain `cargo build` for a contract and
      # requires `stellar contract build` with stellar-cli >= 25.2.0 —
      # same requirement as the contracts job above.
      - name: Install stellar-cli
        env:
          STELLAR_CLI_VERSION: 25.2.0
        run: |
          curl -sSfL "https://github.com/stellar/stellar-cli/releases/download/v${STELLAR_CLI_VERSION}/stellar-cli-${STELLAR_CLI_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP" stellar
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Install wabt (wat2wasm for no_spec.wat)
        run: sudo apt-get update && sudo apt-get install -y wabt

      # Rebuilds the four Rust fixtures, recompiles no_spec.wat and
      # regenerates corrupt_section.wasm, then fails on any byte difference
      # against the committed packages/spec/fixtures/*.wasm.
      - name: Verify fixtures match a fresh build
        run: bash packages/spec/fixture-contracts/build-fixtures.sh --check

  sandbox-fixtures:
    name: sandbox fixtures parity
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            sandbox/fixtures/target
          key: cargo-sandbox-fixtures-${{ hashFiles('sandbox/fixtures/Cargo.lock') }}

      - name: Install stellar-cli
        env:
          STELLAR_CLI_VERSION: 25.2.0
        run: |
          curl -sSfL "https://github.com/stellar/stellar-cli/releases/download/v${STELLAR_CLI_VERSION}/stellar-cli-${STELLAR_CLI_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP" stellar
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Verify fixtures match a fresh build
        run: bash sandbox/fixtures/build.sh && git diff --exit-code sandbox/fixtures/wasm

  e2e:
    name: e2e smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6.1.0

      # The local UI's security tests (#587) run its real server, in Go.
      - uses: actions/setup-go@v7
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ hashFiles('apps/web/package.json') }}

      - name: Install Playwright browsers
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @signet/web exec playwright install --with-deps chromium

      - name: Install Playwright browser deps (cached hit)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: pnpm --filter @signet/web exec playwright install-deps chromium

      - name: Build web app
        run: pnpm --filter @signet/web build

      # `@db` specs need Postgres and live in `e2e-linked`. Each spec runs in
      # exactly one lane: this one takes everything else.
      - name: Run e2e smoke tests
        run: pnpm --filter @signet/web exec playwright test --grep-invert @db

      # The signet dev local UI (#586): axe on every view, in the dark and
      # light themes, and a keyboard-only run, against the built bundle and
      # recorded API answers (apps/sandbox-ui/e2e/harness.mjs).
      - name: Build the local UI
        run: pnpm --filter @signet/sandbox-ui build

      - name: Local UI accessibility and security
        run: pnpm --filter @signet/sandbox-ui exec playwright test

  e2e-linked:
    name: e2e linked flow (Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Separate from `e2e` on purpose. That job is hermetic — no database, no
    # registry, no RPC — and its specs assert the fallback behaviour that
    # depends on staying that way. This one is the opposite: the claim → link →
    # indexer → profile flow only exists when a database does (#277), so it
    # needs its own environment rather than changing the shared one. Specs opt
    # in with `@db` in their describe title (#463).
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: signet
          POSTGRES_PASSWORD: signet
          POSTGRES_DB: signet_e2e
        ports:
          - 5432:5432
        # Without this the job races the container: `migrate deploy` can fire
        # before Postgres is accepting connections.
        options: >-
          --health-cmd "pg_isready -U signet"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://signet:signet@localhost:5432/signet_e2e
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6.1.0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply migrations
        run: pnpm db:deploy

      - uses: actions/setup-go@v7
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum

      - name: Build signet CLI
        working-directory: cli
        run: |
          go build -o "$RUNNER_TEMP/signet" ./cmd/signet
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      # Pinned to MinimumStellarVersion in cli/internal/keys/check.go and cached
      # so driving the real signet + stellar binaries in claim-link-profile.spec.ts
      # adds only seconds to the job (#623).
      - name: Cache stellar-cli
        uses: actions/cache@v6
        id: stellar-cache
        with:
          path: ~/.cache/stellar-cli
          key: stellar-cli-${{ runner.os }}-${{ hashFiles('cli/internal/keys/check.go') }}

      - name: Install stellar-cli
        run: |
          version=$(sed -n 's/^const MinimumStellarVersion = "\(.*\)"/\1/p' cli/internal/keys/check.go)
          if [ -z "$version" ]; then
            echo "::error::Could not read MinimumStellarVersion from cli/internal/keys/check.go"
            exit 1
          fi
          mkdir -p ~/.cache/stellar-cli
          if [ "${{ steps.stellar-cache.outputs.cache-hit }}" != "true" ] || [ ! -x ~/.cache/stellar-cli/stellar ]; then
            curl -sSfL "https://github.com/stellar/stellar-cli/releases/download/v${version}/stellar-cli-${version}-x86_64-unknown-linux-gnu.tar.gz" \
              | tar -xz -C ~/.cache/stellar-cli stellar
          fi
          echo "$HOME/.cache/stellar-cli" >> "$GITHUB_PATH"
          ~/.cache/stellar-cli/stellar --version

      - name: Add e2e deploy key with stellar keys add
        run: |
          secret=$(node -e "const { Keypair } = require('./apps/web/node_modules/@stellar/stellar-sdk'); process.stdout.write(Keypair.random().secret());")
          STELLAR_SECRET_KEY="$secret" stellar keys add e2e-deploy --secret-key --overwrite

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ hashFiles('apps/web/package.json') }}

      - name: Install Playwright browsers
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @signet/web exec playwright install --with-deps chromium

      - name: Install Playwright browser deps (cached hit)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: pnpm --filter @signet/web exec playwright install-deps chromium

      - name: Build web app
        run: pnpm --filter @signet/web build

      # Every database-backed spec (tagged `@db` in its `describe` title): the
      # linked flow and the contract page. The contract-page fixture is loaded
      # by Playwright's globalSetup because DATABASE_URL is set.
      - name: Run the database-backed e2e
        run: pnpm --filter @signet/web exec playwright test --grep @db

      # This spec crosses four systems, so a failure is worth more than a log
      # line: the trace and the page snapshot say which stage broke.
      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-linked-artifacts
          path: |
            apps/web/test-results
            apps/web/playwright-report
          retention-days: 7
          if-no-files-found: ignore

  sandbox:
    name: sandbox simulator (Rust)
    needs: changes
    if: needs.changes.outputs.sandbox == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: sandbox
    steps:
      - uses: actions/checkout@v7

      # sandbox/rust-toolchain.toml pins the exact toolchain and components;
      # rustup installs them on the first cargo call below.
      - uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            sandbox/target
          key: cargo-sandbox-${{ hashFiles('sandbox/Cargo.lock') }}

      - name: Format check
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --locked -- -D warnings

      - name: Test
        run: cargo test --locked

      # The cross-language protocol check (#522): every golden transcript in
      # sandbox/protocol/transcripts/ must validate against the JSON Schemas in
      # sandbox/protocol/schema/v1/, and every schema must be documented in
      # docs/CLI_RUST_BRIDGE.md. It needs `ajv`, which apps/web already pins in
      # the lockfile, so install just that workspace's dependencies.
      - uses: pnpm/action-setup@v6.1.0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies (protocol check)
        working-directory: .
        run: pnpm install --frozen-lockfile --filter @signet/web... --ignore-scripts

      - name: Compile the protocol schemas
        working-directory: .
        run: |
          node -e "
            const Ajv = require('./apps/web/node_modules/ajv');
            const fs = require('fs');
            const ajv = new Ajv({ strict: true });
            const dir = 'sandbox/protocol/schema/v1';
            for (const f of fs.readdirSync(dir)) ajv.compile(JSON.parse(fs.readFileSync(dir + '/' + f, 'utf8')));
            console.log('compiled', fs.readdirSync(dir).length, 'schemas');
          "

      - name: Check protocol transcripts
        run: node protocol/check-transcripts.mjs

      # spec_extract (#545) must emit SpecJson v1, the document the TS reader
      # in packages/spec produces. `cargo test` above built the binary.
      - name: Check spec_extract against SpecJson v1
        run: node protocol/check-spec-json.mjs

      # The host reads specs as the shared TS reader does (#547): the corpus
      # must be the reader's current output, and the host must agree with it
      # on every SpecJson field and every argument encoding and verdict,
      # except what sandbox/conformance/KNOWN_DIFFERENCES.md justifies.
      - name: Spec reader conformance
        run: |
          node --experimental-strip-types conformance/generate.mts --check
          cargo test --locked --test conformance

      # The CLI's sandbox commands against the real host (#555): the Go
      # tests that need a built signet-simulator skip in the cli job, which
      # has no Rust toolchain, and run here, where `cargo test` built one.
      - uses: actions/setup-go@v7
        with:
          go-version-file: cli/go.mod

      - name: CLI sandbox tests against the real simulator
        working-directory: cli
        env:
          SIGNET_SIMULATOR_PATH: ${{ github.workspace }}/sandbox/target/debug/signet-simulator
        run: |
          go test -count=1 -run 'SandboxCall|SandboxForkArchive|SandboxState|SandboxFidelity|TestDev|TestVisualise' ./internal/cmd
          go test -count=1 ./internal/dev ./internal/bundle

  # The reload cycle's benchmarks (#638), through the real binary: swap,
  # simulate (with and without a trace), 20 replays on each side, diff, and a
  # cold start. A median more than 30% slower than the committed baseline
  # (sandbox/simulator/benches/baseline.json, this runner's numbers) fails.
  # Shared runners are noisy, 10-20% between runs is normal: rerun a failure
  # once before believing it, and refresh the baseline from the medians the
  # last step prints when a change is meant to be slower.
  sandbox-bench:
    name: sandbox benchmarks
    needs: changes
    if: needs.changes.outputs.sandbox == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            sandbox/target
          key: cargo-sandbox-bench-${{ hashFiles('sandbox/Cargo.lock') }}

      - name: Benchmarks
        working-directory: sandbox
        run: cargo bench --locked -p signet-simulator --bench cycle --no-default-features --features lane-p28

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Compare with the baseline
        run: node scripts/check-bench.mjs

      - name: Medians for a new baseline
        if: always()
        run: BENCH_RUNNER="GitHub ubuntu-latest" node scripts/check-bench.mjs --write && cat sandbox/simulator/benches/baseline.json

  # Repro bundles replay offline and identically everywhere (#573): each
  # runner replays the committed bundles with fetching denied and writes the
  # full result stream; the job after them asserts the streams are the same
  # bytes on every platform.
  replay:
    name: bundle replay (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.sandbox == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            sandbox/target
          key: cargo-replay-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('sandbox/Cargo.lock') }}

      - name: Build the simulator
        working-directory: sandbox
        run: cargo build --locked -p signet-simulator

      - uses: actions/setup-go@v7
        with:
          go-version-file: cli/go.mod

      - name: Replay the committed bundles
        working-directory: cli
        env:
          SIGNET_SIMULATOR_PATH: ${{ github.workspace }}/sandbox/target/debug/signet-simulator${{ runner.os == 'Windows' && '.exe' || '' }}
        run: |
          mkdir -p "$RUNNER_TEMP/streams"
          for b in ../sandbox/fixtures/bundles/*.json; do
            go run ./cmd/signet sandbox replay "$b" --stream "$RUNNER_TEMP/streams/$(basename "$b" .json).ndjson"
          done

      - uses: actions/upload-artifact@v7
        with:
          name: replay-${{ matrix.os }}
          path: ${{ runner.temp }}/streams

  replay-identical:
    name: bundle replay is identical across platforms
    needs: replay
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: replay-*
          path: streams

      - name: Compare every platform with ubuntu x64
        run: |
          status=0
          for f in streams/replay-ubuntu-latest/*.ndjson; do
            name=$(basename "$f")
            for other in streams/replay-*/"$name"; do
              if ! cmp -s "$f" "$other"; then
                echo "::error::$other differs from $f"
                diff <(head -c 4000 "$f") <(head -c 4000 "$other") || true
                status=1
              fi
            done
          done
          ls -R streams
          exit $status

  simulator-size:
    name: signet-simulator size budget
    needs: changes
    if: needs.changes.outputs.sandbox == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: sandbox
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            sandbox/target
          key: cargo-sandbox-release-${{ hashFiles('sandbox/Cargo.lock') }}

      - name: Build release
        run: cargo build --release --locked -p signet-simulator

      # Every npm install of the CLI downloads this binary (#593). The release
      # profile already strips symbols. First measurement, linux x64 with both
      # lanes (#538): 10,437,224 bytes (protocol 28 alone: 6,808,440, so the
      # second lane costs ~3.6 MB). The budget is that plus 25%: room for the
      # lanes' patch releases and the remaining sandbox verbs, while still
      # catching a third lane or an accidental debug build. Raise it
      # deliberately, with the new measurement, when a lane is added.
      - name: Simulator size budget
        env:
          BUDGET_BYTES: 13046530
        run: |
          bin="target/release/signet-simulator"
          size=$(wc -c < "$bin")
          echo "signet-simulator: ${size} bytes (budget ${BUDGET_BYTES})"
          if [ "$size" -gt "$BUDGET_BYTES" ]; then
            echo "::error::signet-simulator ${size} bytes exceeds budget ${BUDGET_BYTES} bytes"
            exit 1
          fi

  security:
    name: dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6.1.0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Advisory for now (does not fail the build) — flip to blocking once the
      # tree is clean. Tighten the level to `moderate` as you triage.
      - name: pnpm audit
        run: pnpm audit --audit-level high || true

      - uses: dtolnay/rust-toolchain@stable

      - name: cargo audit
        run: |
          cargo install cargo-audit --locked || true
          (cd packages/contracts && cargo audit) || true
          (cd sandbox && cargo audit) || true
          (cd sandbox/fixtures && cargo audit) || true
