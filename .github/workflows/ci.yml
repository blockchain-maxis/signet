name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    name: lint • typecheck • test • build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  contracts:
    name: soroban contract tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            packages/contracts/target
          key: cargo-${{ hashFiles('packages/contracts/Cargo.lock') }}

      - name: Test
        working-directory: packages/contracts
        run: cargo test

      - name: Build wasm
        working-directory: packages/contracts
        run: cargo build --target wasm32v1-none --release

  e2e:
    name: e2e smoke tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@v5
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ hashFiles('apps/web/package.json') }}

      - name: Install Playwright browsers
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @signet/web exec playwright install --with-deps chromium

      - name: Install Playwright browser deps (cached hit)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: pnpm --filter @signet/web exec playwright install-deps chromium

      - name: Build web app
        run: pnpm --filter @signet/web build

      - name: Run e2e smoke tests
        run: pnpm --filter @signet/web test:e2e

  security:
    name: dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Advisory for now (does not fail the build) — flip to blocking once the
      # tree is clean. Tighten the level to `moderate` as you triage.
      - name: pnpm audit
        run: pnpm audit --audit-level high || true

      - uses: dtolnay/rust-toolchain@stable

      - name: cargo audit
        run: |
          cargo install cargo-audit --locked || true
          (cd packages/contracts && cargo audit) || true
