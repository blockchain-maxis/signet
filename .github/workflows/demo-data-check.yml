name: Demo Data Check

# Non-blocking guard: verifies each demo wallet in the profile fixtures still
# resolves on Horizon, so a dead demo persona surfaces visibly instead of
# silently breaking its profile page. It runs on a schedule and on demand, and
# on pushes to main that touch the demo data — deliberately NOT on pull_request,
# so it can never block a merge.

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - 'packages/types/src/index.ts'
      - 'apps/web/public/data/**'
      - 'scripts/check-demo-wallets.mjs'
      - '.github/workflows/demo-data-check.yml'

jobs:
  demo-wallets:
    name: Demo wallets resolve on Horizon
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check demo wallets resolve on Horizon
        run: node --experimental-strip-types scripts/check-demo-wallets.mjs
        env:
          # Demo data is synthetic Stellar testnet; override with a repo variable
          # if the demo personas are ever backed on another network.
          HORIZON_URL: ${{ vars.DEMO_HORIZON_URL || 'https://horizon-testnet.stellar.org' }}
