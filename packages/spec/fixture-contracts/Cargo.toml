[workspace]
resolver = "2"
members = [
  "types_zoo",
  "undocumented",
  "events",
  "errors_multi",
  "upgrade_v1",
  "upgrade_v2",
]

[workspace.dependencies]
soroban-sdk = "28"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
