[package]
name = "identity-registry"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
# Property/fuzz testing. Dev-only, so it never reaches the deployed wasm.
proptest = { workspace = true }
