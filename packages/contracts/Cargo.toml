[workspace]
resolver = "2"
members = ["identity-registry"]

[workspace.dependencies]
soroban-sdk = "29"
proptest = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
